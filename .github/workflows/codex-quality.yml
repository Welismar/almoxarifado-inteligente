name: Codex Quality
on:
  pull_request:
  push:
    branches:
      - 'codex/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quality checks
        shell: bash
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
